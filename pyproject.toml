[project]
name = "advanced-file-finder"
version = "0.1.0"
description = "A responsive desktop file search tool with advanced filtering"
readme = "README.md"
authors = [{ name = "wt-x", email = "2773050934@qq.com" }]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
advanced-file-finder = "advanced_file_finder.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.7"]
