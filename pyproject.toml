[project]
name = "dark-forest-snake"
version = "0.1.0"
description = "黑暗森林贪吃蛇 —— 双人、黑暗视野、信息不完全、资源争夺、技能、PvP 对抗的贪吃蛇"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame-ce>=2.5.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dark_forest_snake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
